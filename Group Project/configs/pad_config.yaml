# Versioned runtime configuration for the anti-spoofing (PAD) check.
# Any change here is committed and released with a new config_version.
config_version: 1
model:
  name: minifasnet-baseline
  version: 0.1.0          # pad-model vMAJOR.MINOR.PATCH
  format: onnx-int8
decision:
  threshold: 0.50         # placeholder - final value chosen on validation data (BPCER <= 5%)
  frames_per_attempt: 12
  aggregation: median
  attempt_timeout_s: 5
  retry_limit: 3
  lockout_minutes: 5
preprocessing:
  face_detector: yunet
  crop_scale: 2.7
  input_size: [80, 80]
  min_face_px: 80
  min_brightness: 40
  min_blur_variance: 60
logging:
  store_face_images: false
